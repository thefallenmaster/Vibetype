<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeType</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Video Setup Section -->
        <div class="video-setup" id="video-setup">
            <h2>Select a Video to Play</h2>
            <div class="setup-controls">
                <input type="text" id="video-url" placeholder="Paste video link (mp4, webm)" class="styled-input">
                <button id="load-url-btn" class="styled-btn">Load Video from URL</button>
                <div class="divider"><span>OR</span></div>
                <label for="video-upload" class="styled-btn upload-btn">
                    Upload Local Video
                    <input type="file" id="video-upload" accept="video/*">
                </label>
            </div>
        </div>

        <!-- Video Player Section (Hidden initially) -->
        <div class="video-section" id="video-section" style="display: none;">
            <video id="main-video" controls playsinline>
                Your browser does not support the video tag.
            </video>
            <button id="change-video-btn" class="change-video-btn">Change Video</button>
        </div>

        <!-- Typing Test Section -->
        <div class="typing-section">
            <div class="stats">
                <div class="stat">
                    <span class="label">WPM</span>
                    <span class="value" id="wpm">0</span>
                </div>
                <div class="stat">
                    <span class="label">Accuracy</span>
                    <span class="value" id="accuracy">100%</span>
                </div>
            </div>
            
            <div class="text-display" id="text-display">
                <!-- Text will be injected here by JS -->
            </div>
            
            <input type="text" id="hidden-input" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus>
            
            <button class="restart-btn" id="restart-btn" title="Restart Test (Esc)">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
            </button>
            
            <div class="shortcuts-hint" style="text-align: center; margin-top: 1rem; opacity: 0.5; font-size: 0.8rem; display: flex; justify-content: center; gap: 1.5rem;">
                <span><kbd style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;">Esc</kbd> Restart</span>
                <span><kbd style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;">Alt + C</kbd> Change Video</span>
                <span>Start typing to auto-focus!</span>
            </div>
        </div>
    </div>
    
    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="script.js"></script>
</body>
</html>
